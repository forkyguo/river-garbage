# HELVLAJI — multi-class river garbage detection (nc=9)
# Template shipped with the paper companion. Change `path` to your local copy
# and replace the placeholder class names with the real ones.
# Used by: yolo11s-helvlaji*.yaml, r2/yolov8s-helv.yaml
path: /path/to/helvlaji
train: images/train
val: images/val
test: images/test
nc: 9
names:
  0: class_0
  1: class_1
  2: class_2
  3: class_3
  4: class_4
  5: class_5
  6: class_6
  7: class_7
  8: class_8
